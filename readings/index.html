<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #fafaf7;
      line-height: 1.6;
    }
    h1 { margin-bottom: 30px; }

    details {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }
    summary {
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before {
      content: "+";
      display: inline-block;
      width: 1.2em;
      color: #888;
    }
    details[open] summary::before { content: "−"; }
    summary:hover { color: #555; }

    .content {
      padding: 10px 0 5px 1.2em;
    }
  </style>
</head>
<body>

  <h1>My Page</h1>

  <!-- ===== COPY FROM HERE ===== -->
  <details>
    <summary>First title</summary>
    <div class="content">
      <p>Write your comments here.</p>
      <p>You can add as many paragraphs as you like.</p>
    </div>
  </details>
  <!-- ===== TO HERE to add a new section ===== -->

  <details>
    <summary>Second title</summary>
    <div class="content">
      <p>More comments go here.</p>
    </div>
  </details>

  <details>
    <summary>Third title</summary>
    <div class="content">
      <p>And here.</p>
    </div>
  </details>

</body>
</html>
